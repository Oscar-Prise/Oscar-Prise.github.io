<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark II — 3D Render</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2290%22%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
<!-- SOLIDWORKS Visualize export, trimmed for oscar-prise.github.io: the viewer
     fills the window, with no header bar or fit/actual-size buttons. -->
<script src="js/prototype.js"></script>
<script src="js/browserdetect.js"></script>
<script src="js/apple_core.js"></script>
<script src="js/vr.js"></script>
<script src="js/library.js"></script>
<script src="js/threesixty.js"></script>
<script src="js/wheelzoom.js"></script>
<script src="js/observers.js" defer></script>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #viewer { width:100vw; height:100vh; display:block; cursor:grab; }
  #viewer:active { cursor:grabbing; }
  #viewer .vr { display:flex; align-items:center; justify-content:center; }
  .hint {
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
    font:500 13px/1 ui-monospace, monospace; letter-spacing:.06em;
    color:#eee; background:rgba(0,0,0,.55); padding:7px 12px; pointer-events:none;
    transition:opacity .4s;
  }
  .hint.gone { opacity:0; }
</style>
</head>
<body>
<div id="viewer"></div>
<div class="hint" id="hint">drag to rotate &middot; scroll to zoom</div>
<script>
  var hint = document.getElementById('hint');
  ['mousedown', 'touchstart', 'wheel'].forEach(function (ev) {
    // capture phase: vr.js stops the event before it bubbles
    window.addEventListener(ev, function () { hint.classList.add('gone'); }, { once: true, capture: true });
  });
</script>
</body>
</html>
